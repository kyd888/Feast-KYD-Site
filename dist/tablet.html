<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17241c">
  <title>Scan to enter GROVES</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="tablet-page">
  <a class="tablet-back" href="./">Back to the website</a>
  <main class="tablet-poster">
    <section class="signal-art" aria-labelledby="tablet-title">
      <div class="signal-meta"><span>Paseo FEAST</span><span>2026 finalist</span></div>
      <div class="signal-sky" aria-hidden="true">
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
        <span class="moon"></span>
        <span class="star star-one">✦</span>
        <span class="star star-two">✦</span>
        <span class="star star-three">·</span>
        <svg class="grove-drawing" viewBox="0 0 900 330" role="presentation">
          <path d="M0 280C100 234 180 286 274 239C368 192 444 272 532 224C628 172 702 228 900 145V330H0Z" fill="#d6b6a3"/>
          <g fill="#17241c">
            <path d="M92 273l50-139 19 64 28-98 39 173z"/><path d="M204 274l36-101 18 59 27-116 44 158z"/>
            <path d="M520 261l42-135 20 71 31-115 41 179z"/><path d="M636 239l36-106 20 55 27-98 45 149z"/>
            <path d="M754 220l34-99 21 57 23-86 48 128z"/>
          </g>
          <path d="M-20 295C145 258 213 316 356 273C493 232 585 300 920 211" fill="none" stroke="#f3efe4" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="signal-title">
        <p class="tablet-kyd">KYD presents</p>
        <h1 id="tablet-title">GROVES</h1>
        <p class="signal-night">Signal Night</p>
        <p class="signal-line">Original songs / projected forests / collected memories</p>
      </div>
    </section>
    <section class="scan-panel" aria-label="Scan the GROVES website QR code">
      <p class="scan-kicker">Take the project with you</p>
      <div class="qr-frame"><img src="qr.svg?v=netlify" alt="QR code opening https://feastkyd.netlify.app/" width="640" height="640"></div>
      <h2>Scan to step inside</h2>
      <p class="scan-copy">Hear the story. Explore the project.<br>Help KYD bring GROVES to life.</p>
      <a class="site-url" href="https://feastkyd.netlify.app/">feastkyd.netlify.app</a>
      <div class="tablet-controls">
        <button type="button" class="text-button" id="present">Full screen</button>
        <button type="button" class="text-button" id="copy-project">Copy link</button>
        <a href="qr.svg" download="GROVES-QR.svg">Download QR</a>
      </div>
      <p class="tablet-status" id="tablet-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
